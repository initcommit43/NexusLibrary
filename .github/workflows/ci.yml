name: CI

# Both branches, because dev is where the work happens and main is what gets deployed —
# a check that only ran on one of them would be a check on the wrong thing half the time.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Testcontainers starts a real Postgres 17, which is the whole point of the suite:
      # Flyway migrations and Postgres-only column types run exactly as they do deployed.
      # ubuntu-latest ships a working Docker daemon, so nothing needs setting up for it.
      #
      # No secrets are needed. application-test.yml carries its own signing key and points
      # every external API at a dead address, so a test can never reach a real provider.
      - name: Run the suite
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the Dockerfile's node:24-alpine, so a build that passes here is the build
      # the image produces.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # tsc -b then vite build: the type check is the half that catches things, and it only
      # runs as part of the build.
      - name: Build
        working-directory: frontend
        run: npm run build
