nexus:
  notifications:
    # A sweep that starts itself midway through a test writes rows the test is about to
    # truncate. Tests that want one call the detector.
    sweep: false
  jwt:
    # Test-only value; the real secret comes from the environment.
    secret: test-only-signing-key-not-used-anywhere-else-0123456789
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  security:
    cookie-secure: false
    allowed-origins: http://localhost:5173
    frontend-url: http://localhost:5173
    registration-open: true
    password-reset-ttl-minutes: 30
  rate-limit:
    auth-requests-per-minute: 100
    search-requests-per-minute: 1000
    import-requests-per-minute: 1000
  refresh:
    # Same values as production; tests that care about staleness set the clock in SQL.
    ongoing-ttl: 24h
    upcoming-ttl: 24h
    retry-after: 15m
    max-items-per-read: 50
  igdb:
    # Tests stub the transport; these are never used to reach the real IGDB.
    client-id: test-client-id
    client-secret: test-client-secret
    api-base-url: http://127.0.0.1:1/igdb/v4
    token-url: http://127.0.0.1:1/twitch/oauth2/token
    requests-per-second: 1000
  anilist:
    # Tests stub the transport; this never reaches the real AniList.
    api-url: http://127.0.0.1:1/anilist/graphql
    client-id: test-anilist-client
    client-secret: test-anilist-secret
    authorize-url: http://127.0.0.1:1/anilist/oauth/authorize
    token-url: http://127.0.0.1:1/anilist/oauth/token
    requests-per-minute: 6000
    retry-backoff-ms: 1
  mal:
    # Tests stub the transport; this never reaches the real MyAnimeList.
    api-url: http://127.0.0.1:1/mal/v2
    client-id: test-mal-client
    client-secret: test-mal-secret
    authorize-url: http://127.0.0.1:1/mal/oauth2/authorize
    token-url: http://127.0.0.1:1/mal/oauth2/token
    requests-per-second: 1000
    retry-backoff-ms: 1
  steam:
    api-key: test-steam-key
    api-base-url: http://127.0.0.1:1/steam
    open-id-endpoint: http://127.0.0.1:1/steam/openid/login
    achievement-requests-per-second: 1000
  encryption:
    # Test-only key; production reads NEXUS_ENCRYPTION_KEY from the environment.
    key: bmV4dXMtdGVzdC1vbmx5LWVuY3J5cHRpb24ta2V5ISE=

spring:
  datasource:
    hikari:
      # Every cached Spring context holds a pool of its own, and the suite keeps a dozen or
      # more alive at once — one per distinct set of mocks or overridden properties. At the
      # default size of ten that is more connections than Postgres allows, and the classes
      # loaded last fail to start at all with "too many clients already".
      #
      # Nothing here needs a deep pool: a test makes one request at a time. Four rather than
      # one because an achievement sync runs on a background thread and takes a second
      # connection while the test thread holds its own.
      maximum-pool-size: 4
      minimum-idle: 0
  http:
    client:
      # The hosts named in here do not exist. A test that reaches one is testing what happens
      # when a source is unreachable, and that should take a moment rather than the ten
      # seconds a real deployment is right to wait.
      connect-timeout: 500ms
      read-timeout: 1s
