spring:
  application:
    name: nexus
  datasource:
    # One credential for both Flyway and the runtime pool, which is enough because the two
    # need so little: Flyway needs CREATE on schema public, and the app needs no DDL at all
    # (ddl-auto below is validate, and nothing outside the migrations issues any). No
    # migration needs elevated rights either — there is no CREATE EXTENSION, no schema, no
    # function and no trigger in any of them — so this role must not be a superuser. A
    # deployment strips it once: ALTER ROLE <user> NOSUPERUSER NOCREATEROLE NOCREATEDB.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # A CSV export of a large library is a few hundred kilobytes; this is generous for
      # that and still small enough that nobody can post a film through the upload field.
      max-file-size: 5MB
      max-request-size: 6MB
  http:
    client:
      # Every outbound call gets an end. Without these a source that accepts a connection and
      # then says nothing holds the calling thread for good: an AniList 504 left an activity
      # sync stopped mid-walk with no error and no way to tell it apart from a finished run.
      connect-timeout: 10s
      read-timeout: 30s
  web:
    # Pin validation messages to English; otherwise they follow the server's system
    # locale and the API answers in whatever language the host happens to run in.
    locale: en
    locale-resolver: fixed

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

nexus:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: 30
    # A retired refresh token presented again inside this window is two clients refreshing at
    # once, not theft. Past it, nobody holds one for an innocent reason. Long enough for a
    # phone waking two requests together, short enough that a stolen copy is caught the first
    # time it is spent.
    refresh-reuse-grace-seconds: 10
  security:
    # Browsers reject Secure cookies over plain http, which local dev uses.
    cookie-secure: true
    allowed-origins: ${ALLOWED_ORIGINS:}
    # Where Steam sends the browser back to. Built from config, never from the request.
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    # Set REGISTRATION_OPEN=false on a deployment once its accounts exist: the URL is public,
    # and an open sign-up on it is a stranger spending the API budget. Signing in is untouched.
    registration-open: ${REGISTRATION_OPEN:true}
    # How many proxies stand in front, which is how far in from the end of X-Forwarded-For
    # the caller's own address sits. Nothing in front locally, so nothing is forwarded and
    # the peer is the caller. Raise it per deployment, never above the real number: too high
    # reads an entry the caller wrote themselves and hands them a rate-limit bucket each.
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}
    # How long a mailed password reset link works. Half an hour: it is read within minutes of
    # arriving, and past that it is only a live credential sitting in an inbox.
    password-reset-ttl-minutes: 30
  rate-limit:
    auth-requests-per-minute: 10
    search-requests-per-minute: 30
    # An import touches a whole library and spends external API budget.
    import-requests-per-minute: 3
  mail:
    # Must be an address on a domain verified with the provider. Until one is, Resend accepts
    # mail to the account owner's own address and silently drops everything else — the send
    # succeeds and nothing arrives, which is why verification below defaults to off.
    from: ${MAIL_FROM:NexusLibrary <onboarding@resend.dev>}
    resend:
      # Unset means no mailer at all: dev and test log the message, production sends nothing
      # and says so rather than reporting success for a mail nobody will receive.
      api-key: ${RESEND_API_KEY:}
  verification:
    # Off by default, and deliberately. On, an account cannot be signed into until its link is
    # followed — so a deployment that cannot actually deliver mail would create accounts nobody
    # can ever open. Turn this on once a sending domain is verified, not before.
    required: ${REQUIRE_EMAIL_VERIFICATION:false}
    # Longer than a reset link's half hour: this one is read when someone gets round to it and
    # grants nothing beyond confirming an address already on the account.
    ttl-hours: 48
  registration:
    # Confirming the address is a separate gate above; these three decide whether an address is
    # worth sending anything to in the first place. Both checks can turn a real person away, so
    # both can be switched off without a rebuild if one starts doing that.
    block-disposable-domains: ${BLOCK_DISPOSABLE_EMAIL:true}
    require-deliverable-domain: ${REQUIRE_DELIVERABLE_EMAIL:true}
    # A DNS lookup on the sign-up path. Past this the address is allowed through unchecked:
    # a slow resolver is a fact about this server, not about the address.
    deliverability-timeout-millis: 2500
  client-version:
    # The oldest installed app build this deployment still answers. Raise it only alongside a
    # release that is already in the store, or the app tells people to fetch one that is not
    # there yet. The default forces nothing, which is what a deployment with no app wants.
    minimum: ${CLIENT_MINIMUM_VERSION:0.0.0}
  browse:
    # A browse shelf is the same list for every reader, so it is fetched once and shared.
    # Long enough that a page view costs nothing; short enough that "coming soon" stays true.
    ttl: 6h
  refresh:
    # An ongoing or upcoming title can change any day; a released one is settled and is
    # never refreshed at all, which is what keeps a big library off the API budget.
    ongoing-ttl: 24h
    upcoming-ttl: 24h
    # Backoff for a source that is down or has dropped an item.
    retry-after: 15m
    max-items-per-read: 50
  igdb:
    client-id: ${IGDB_CLIENT_ID:}
    client-secret: ${IGDB_CLIENT_SECRET:}
    api-base-url: https://api.igdb.com/v4
    token-url: https://id.twitch.tv/oauth2/token
    # IGDB permits 4 requests per second.
    requests-per-second: 4
  anilist:
    # Public for reads: search and media lookups need no key. Only importing a user's own
    # list involves OAuth, which phase 5 adds separately.
    api-url: https://graphql.anilist.co
    # Only needed to connect an account; search works without them.
    client-id: ${ANILIST_CLIENT_ID:}
    client-secret: ${ANILIST_CLIENT_SECRET:}
    authorize-url: https://anilist.co/api/v2/oauth/authorize
    token-url: https://anilist.co/api/v2/oauth/token
    # AniList's own header says 30 a minute, not the 90 its docs long advertised. Pacing at
    # 90 spends the budget three times as fast as it refills, which arrives as a 429 partway
    # through whatever was running.
    requests-per-minute: 30
    retry-backoff-ms: 1500
  mal:
    api-url: https://api.myanimelist.net/v2
    # Registered at myanimelist.net/apiconfig. OAuth like AniList's, but not its flow:
    # PKCE is mandatory (plain only) and tokens live about a month, so refresh is real.
    client-id: ${MAL_CLIENT_ID:}
    client-secret: ${MAL_CLIENT_SECRET:}
    authorize-url: https://myanimelist.net/v1/oauth2/authorize
    token-url: https://myanimelist.net/v1/oauth2/token
    requests-per-second: 1
    retry-backoff-ms: 1500
  tmdb:
    api-base-url: https://api.themoviedb.org/3
    image-base-url: https://image.tmdb.org/t/p/
    poster-size: w500
    backdrop-size: w1280
    profile-size: w185
    # The v4 "API Read Access Token" from themoviedb.org/settings/api, sent as a bearer.
    # Application-wide and non-expiring, so films and shows need no per-user OAuth at all.
    access-token: ${TMDB_ACCESS_TOKEN:}
    # TMDB publishes no hard ceiling any more; this keeps an import from finding one.
    requests-per-second: 20
  simkl:
    api-base-url: https://api.simkl.com
    # Registered at simkl.com/settings/developer. The redirect URI registered there must be
    # <FRONTEND_URL>/settings/simkl/callback, and the exchange has to present the same value.
    client-id: ${SIMKL_CLIENT_ID:}
    client-secret: ${SIMKL_CLIENT_SECRET:}
    authorize-url: https://simkl.com/oauth/authorize
    token-url: https://api.simkl.com/oauth/token
    # Simkl identifies the caller on every request, not only at authorization.
    app-name: nexus-media-tracker
    app-version: "1.0"
    # A whole import is two calls; this is only here so a retry storm cannot become one.
    requests-per-second: 3
  open-library:
    api-base-url: https://openlibrary.org
    cover-base-url: https://covers.openlibrary.org
    cover-size: L
    # Open Library asks callers to identify themselves and leave a contact address, and
    # throttles the ones that do not. This is a condition of use, not a nicety.
    user-agent: ${OPEN_LIBRARY_USER_AGENT:NexusLibrary/1.0 (https://github.com/initcommit43/NexusLibrary)}
    # Nothing meters this — there is no account. It is a courtesy to a nonprofit's servers,
    # so a large import does not arrive looking like an attack.
    requests-per-second: 10
  steam:
    api-key: ${STEAM_API_KEY:}
    api-base-url: https://api.steampowered.com
    open-id-endpoint: https://steamcommunity.com/openid/login
    achievement-requests-per-second: 1
  encryption:
    # 32 bytes, base64. Generate with: openssl rand -base64 32
    key: ${NEXUS_ENCRYPTION_KEY}
  turnstile:
    # Cloudflare Turnstile, in front of the forms reachable without an account. Registered at
    # dash.cloudflare.com. The site key is public and goes to the browser; the secret key never
    # leaves the server. Unset locally, which switches the check off so dev can still register —
    # a deployment on a public URL must set both, and the app warns at boot when it has not.
    site-key: ${TURNSTILE_SITE_KEY:}
    secret-key: ${TURNSTILE_SECRET_KEY:}
    verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
